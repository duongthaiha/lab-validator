# Prevents credentials reaching git history.
#   pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: block-credential-files
        name: block credential-bearing files
        entry: >-
          Refusing to commit a credential-bearing file. Session state, .env
          files, HAR archives and Playwright traces can impersonate your
          account. If this was staged by mistake, run `git rm --cached <file>`.
        language: fail
        files: >-
          (?x)^(
            \.auth/.*
            |\.env$
            |\.env\.(?!example).*
            |.*\.har$
            |.*trace\.zip$
            |.*storage[_-]?state.*\.json$
          )$
