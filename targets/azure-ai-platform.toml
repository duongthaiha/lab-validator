# Target descriptor for one Skillable lab.
#
# Everything lab-specific lives here as DATA. If the validator ever needs a code
# change to walk a different workshop, that is a bug in the engine, not a gap in
# this file. Structure (segments, tasks, anchors) is NOT listed here: it is
# derived from the instructions DOM by lab_validator.corpus, so it stays correct
# when the lab author edits the content.

slug = "azure-ai-platform"
name = "WorkshopPLUS - Azure AI Platform and Services"

[lab]
id = 79233
class_id = 763682
enrollment = 5928204
edition = "Azure AI: Platform and Services, All Modules (20260318)"
duration_hours = 96
enrollment_url = "https://mslearningcampus.com/ClassEnrollment/5928204"

[environment]
# The lab hands out a Hyper-V jumpbox AND an Azure cloud slice.
kind = ["virtualization", "cloud-slice"]
cloud = "azure"
# Cloud credentials are reissued on a shorter clock than the lab itself, so a
# full walk crosses several windows. Refresh proactively rather than on failure.
credential_hours = 8
vm_user = "Admin"
lab_files = 'C:\Users\Admin\Desktop\LABS'

[expect]
# Resource names carry a per-instance number, so match on prefix.
region = "East US 2"
region_slug = "eastus2"
resource_group = "azureaiworkshoprg"
project = "firstProject"
resource_prefixes = [
    "ai-foundry-",
    "myopai-",
    "logiapp1-",
    "cv-",
    "faceresource-",
    "pgaivector-",
]

# Models the lab tells the learner to deploy. Checked against the Azure ARM
# model-lifecycle oracle: API "Deprecating" means the portal shows "Deprecated",
# and API "Deprecated" means the portal shows "Retired". Compare the retirement
# date to the run date; never string-match the word.
models = [
    "gpt-4o",
    "gpt-4o-mini",
    "text-embedding-3-large",
    "text-embedding-ada-002",
]

[risks]
# Structural dependencies worth re-asserting on every run, because when one
# breaks it breaks many segments at once.
legacy_ui_toggle = """
Every lab navigates the legacy Microsoft Foundry left-hand menu, which is only
reachable via the "New Foundry" experience toggle. New Foundry is now the
default. If that toggle is removed, all labs break simultaneously.
"""

# Full human-fidelity execution is the default. Anything listed under
# [deferrals] is deliberately not attempted and MUST carry a justification that
# survives review; convenience is not a justification. Empty by design.
[deferrals]
