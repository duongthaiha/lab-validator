[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-validator"
version = "0.1.0"
description = "Validates Microsoft Learning Campus (Skillable) hands-on lab instructions against live product state"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "playwright>=1.49",
    "httpx>=0.27",
    "azure-identity>=1.19",
    "azure-mgmt-cognitiveservices>=13.5",
    "pillow>=11.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "pre-commit>=4.0",
]

[project.scripts]
lab-validator = "lab_validator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# S101 assert, S603/S607 subprocess: acceptable in this codebase
ignore = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
